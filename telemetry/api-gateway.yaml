openapi: 3.0.0
info:
  title: Diplodoc VS Code telemetry
  version: 1.0.0

paths:
  /telemetry:
    post:
      operationId: collectTelemetry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '202':
          description: Batch forwarded to the Yandex collector
        '400':
          description: Invalid telemetry batch
        '413':
          description: Request body exceeds 64 KiB
        '415':
          description: JSON required
        '502':
          description: Yandex collector unavailable
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: d4e78smfm7fspkagvaj2
        tag: $latest
        service_account_id: aje26jt8j7brfphr3kk1
        payload_format_version: '0.1'
